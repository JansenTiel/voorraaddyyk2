<!doctype html>
<html lang="nl">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>

<title>Scan Inslag / Uitslag</title>

<link rel="stylesheet" href="/css/theme.css"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

</head>

<body data-page="scan">

<div class="topbar">
<div class="inner">

<div class="brand">
<div class="logo">o</div>
<div class="title">
Oegema Logistics
<small>Dyyk · Voorraadbeheer</small>
</div>
</div>

<nav class="nav">
<a href="/">Dashboard</a>
<a href="/products">Artikelen + Stickers</a>
<a class="active" href="/scan">In-/Uitscan</a>
<a href="/stock">Huidige voorraad</a>
<a href="/outscans">Uitscans</a>
<a href="/inventory">Inventarisatie</a>
</nav>

</div>
</div>



<div class="container">

<div id="toast" class="notice"></div>

<div class="card">

<h2>Scan Inslag / Uitslag</h2>

<div class="muted">
Scan eerst alle colli. Daarna verwerk je de batch.
</div>


<div class="tabs" style="margin-top:16px">

<button class="tab active" id="tabIn">Inslag</button>
<button class="tab" id="tabOut">Uitslag</button>

</div>


<div class="row" style="margin-top:16px">

<div>
<label>Sticker / SKU</label>
<input id="skuInput" placeholder="Scan sticker"/>
</div>

<div>
<label>Locatie</label>
<input id="locInput" placeholder="Locatie"/>
</div>

</div>


<div id="outBlock" class="hidden" style="margin-top:12px">

<label>Ordernummer</label>
<input id="orderInput" placeholder="Ordernummer"/>

</div>


<div class="btnRow" style="margin-top:16px">

<button class="btn primary" id="btnProcess">
Batch verwerken
</button>

<button class="btn" id="btnClear">
Batch leegmaken
</button>

<button class="btn ghost" id="btnQR">
Start QR
</button>

</div>


<div class="card" style="margin-top:20px">

<div class="kpi">
<div class="label">Gescande colli</div>
<div class="value" id="batchCount">0</div>
</div>

<div id="batchList" style="margin-top:12px"></div>

</div>


<div class="card" style="margin-top:20px">

<b>QR scanner</b>

<div id="qr_reader" class="hidden" style="margin-top:10px"></div>

</div>


</div>
</div>



<script>

setActiveNav()

const client = sb()

const skuInput = byId("skuInput")
const locInput = byId("locInput")
const orderInput = byId("orderInput")

const batchCount = byId("batchCount")
const batchList = byId("batchList")

const tabIn = byId("tabIn")
const tabOut = byId("tabOut")

const outBlock = byId("outBlock")

let mode = "IN"
let batch = []


function renderBatch(){

batchCount.textContent = batch.length

if(!batch.length){

batchList.innerHTML =
"<div class='muted'>Nog geen colli gescand.</div>"

return

}

batchList.innerHTML = `
<table>
<thead>
<tr>
<th>#</th>
<th>SKU</th>
</tr>
</thead>
<tbody>

${batch.map((s,i)=>`
<tr>
<td>${i+1}</td>
<td><b>${escapeHtml(s)}</b></td>
</tr>
`).join("")}

</tbody>
</table>
`

}



function addScan(){

const sku = normalizeScan(skuInput.value)

if(!sku) return

if(batch.includes(sku)){
toast("Sticker al gescand","err")
skuInput.value=""
return
}

batch.push(sku)

renderBatch()

skuInput.value=""
skuInput.focus()

}



skuInput.addEventListener("keydown",e=>{

if(e.key==="Enter"){

e.preventDefault()

addScan()

if(mode==="OUT") orderInput.focus()

}

})



tabIn.onclick = ()=>{

mode="IN"

tabIn.classList.add("active")
tabOut.classList.remove("active")

outBlock.classList.add("hidden")

}

tabOut.onclick = ()=>{

mode="OUT"

tabOut.classList.add("active")
tabIn.classList.remove("active")

outBlock.classList.remove("hidden")

}



async function processBatch(){

if(!batch.length){
toast("Geen scans","err")
return
}

const location = locInput.value.trim()
const orderNo = orderInput.value.trim()

try{

for(const sku of batch){

const {data:item,error} = await client
.from("items")
.select("*")
.eq("sku_unique",sku)
.maybeSingle()

if(error) throw error

if(!item){
throw new Error("Sticker niet gevonden: "+sku)
}


if(mode==="IN"){

await client
.from("items")
.update({
status:"IN_STOCK",
location,
in_at:new Date().toISOString(),
out_at:null
})
.eq("id",item.id)

await client
.from("movements")
.insert({
type:"IN",
product_id:item.product_id,
sku_unique:sku,
location
})

}


else{

await client
.from("items")
.update({
status:"OUT",
out_at:new Date().toISOString()
})
.eq("id",item.id)

await client
.from("movements")
.insert({
type:"OUT",
product_id:item.product_id,
sku_unique:sku,
location:item.location,
order_no:orderNo
})

}

}

toast(batch.length+" colli verwerkt")

batch=[]
renderBatch()

}
catch(e){

toast(e.message,"err")

}

}



byId("btnProcess").onclick = processBatch

byId("btnClear").onclick = ()=>{

batch=[]
renderBatch()

}



let qr
let qrRunning=false

byId("btnQR").onclick = async ()=>{

if(!qr){
qr = new Html5Qrcode("qr_reader")
}

if(!qrRunning){

const cams = await Html5Qrcode.getCameras()

await qr.start(
cams[0].id,
{fps:10,qrbox:250},
txt=>{
skuInput.value = txt
addScan()
}
)

qrRunning=true
byId("qr_reader").classList.remove("hidden")

}

else{

await qr.stop()
qrRunning=false

byId("qr_reader").classList.add("hidden")

}

}



renderBatch()
skuInput.focus()

</script>

</body>
</html>
