<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Scan Inslag / Uitslag</title>
  <link rel="stylesheet" href="theme.css"/>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
</head>
<body>
<div class="topbar"><div class="inner"><div class="brand"><div class="logo">o</div><div class="title">Oegema Logistics<small>Klant: Dyyk</small></div></div><nav class="nav"><a href='index.html'>Dashboard</a><a href='products.html'>Artikelen + Stickers</a><a href='scan.html'>Inslag / Uitslag (Scan)</a><a href='stock.html'>Huidige voorraad</a><a href='outscans.html'>Uitscans</a></nav></div></div>
<div class="container"><div id="toast" class="notice"></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end"><div><h2>Scan</h2><div class="muted">Bulk inslag en bulk uitslag met handscanner of QR-camera.</div></div><span class="pill">Status: <b id="statusTxt">Klaar</b></span></div><div class="tabs" style="margin-top:16px"><button class="tab active" id="tabIn" type="button">Inslag</button><button class="tab" id="tabOut" type="button">Uitslag</button></div><div class="row" style="margin-top:16px"><div><label for="skuInput">SKU / sticker</label><input id="skuInput" placeholder="Scan SKU…"/></div><div><label for="locInput">Locatie</label><input id="locInput" placeholder="Scan locatie…"/></div></div><div id="outBlock" class="hidden" style="margin-top:12px"><label for="orderInput">Ordernummer</label><input id="orderInput" placeholder="Vul ordernummer in…"/></div><div class="btnRow" style="margin-top:16px"><button class="btn primary" id="btnGo" type="button">Batch inboeken</button><button class="btn" id="btnClear" type="button">Leegmaken</button><button class="btn ghost" id="btnQr" type="button">Start QR</button></div><div class="card" style="margin-top:16px;box-shadow:none"><div class="pill">Gescande colli: <b id="batchCount">0</b></div><div class="btnRow" style="margin-top:12px"><button class="btn ghost" id="btnUndoLast" type="button">Laatste weg</button><button class="btn danger" id="btnClearBatch" type="button">Batch leegmaken</button></div><div id="batchList" style="margin-top:12px"></div></div><div class="card" style="margin-top:16px;box-shadow:none"><div class="btnRow" style="justify-content:space-between"><div><b>QR scannen met camera</b><div class="small">Werkt op telefoon via HTTPS.</div></div></div><div id="qr_reader" class="hidden" style="margin-top:12px;border-radius:14px;overflow:hidden"></div></div></div></div>
<script>
setActiveNav();
const client=sb(); const tabIn=byId('tabIn'), tabOut=byId('tabOut'), outBlock=byId('outBlock'), btnGo=byId('btnGo'), btnClear=byId('btnClear'), btnQr=byId('btnQr'), btnUndoLast=byId('btnUndoLast'), btnClearBatch=byId('btnClearBatch'); const skuInput=byId('skuInput'), locInput=byId('locInput'), orderInput=byId('orderInput'), qrReader=byId('qr_reader'), statusTxt=byId('statusTxt'); const batchCount=byId('batchCount'), batchList=byId('batchList'); let mode='IN', qr=null, qrRunning=false, batchSkus=[];
function setStatus(t){ statusTxt.textContent=t; }
function setMode(m){ mode=m; tabIn.classList.toggle('active',m==='IN'); tabOut.classList.toggle('active',m==='OUT'); outBlock.classList.toggle('hidden',m!=='OUT'); btnGo.textContent=m==='IN'?'Batch inboeken':'Batch uitboeken'; clearForm(false); }
function clearForm(clearBatchToo=true){ skuInput.value=''; locInput.value=''; orderInput.value=''; if(clearBatchToo){ batchSkus=[]; renderBatch(); } setStatus('Klaar'); skuInput.focus(); }
function renderBatch(){ batchCount.textContent=String(batchSkus.length); batchList.innerHTML=batchSkus.length ? `<div class="table-wrap"><table><thead><tr><th>#</th><th>SKU</th></tr></thead><tbody>${batchSkus.map((sku,i)=>`<tr><td>${i+1}</td><td><b>${escapeHtml(sku)}</b></td></tr>`).join('')}</tbody></table></div>` : `<div class="muted">Nog geen colli gescand.</div>`; }
async function doInSingle(skuUnique, location){ const {data:item,error}=await client.from('items').select('id, product_id, sku_unique, status').eq('sku_unique', skuUnique).maybeSingle(); if(error) throw error; if(!item) throw new Error(`SKU bestaat niet: ${skuUnique}`); if(item.status === 'IN_STOCK') throw new Error(`Item staat al op voorraad: ${skuUnique}`); const {error:uErr}=await client.from('items').update({status:'IN_STOCK',location,in_at:new Date().toISOString(),out_at:null}).eq('id',item.id); if(uErr) throw uErr; const {error:mErr}=await client.from('movements').insert([{type:'IN',product_id:item.product_id,sku_unique:skuUnique,location,order_no:null}]); if(mErr) throw mErr; }
async function doBatchIn(location){ if(!batchSkus.length) throw new Error('Scan eerst één of meerdere SKU’s.'); for(const skuUnique of batchSkus){ await doInSingle(skuUnique, location); } }
async function doOutSingle(skuUnique, orderNo, locationOpt){ const {data:item,error}=await client.from('items').select('id, product_id, sku_unique, status, location').eq('sku_unique', skuUnique).maybeSingle(); if(error) throw error; if(!item) throw new Error(`SKU bestaat niet: ${skuUnique}`); if(item.status!=='IN_STOCK') throw new Error(`Uitslag niet mogelijk: ${skuUnique} staat niet op voorraad.`); const {error:uErr}=await client.from('items').update({status:'OUT',out_at:new Date().toISOString()}).eq('id',item.id); if(uErr) throw uErr; const {error:mErr}=await client.from('movements').insert([{type:'OUT',product_id:item.product_id,sku_unique:skuUnique,location:locationOpt || item.location || null,order_no:orderNo}]); if(mErr) throw mErr; }
async function doBatchOut(orderNo, locationOpt){ if(!batchSkus.length) throw new Error('Scan eerst één of meerdere SKU’s.'); const used=await countOrderUses(client, orderNo).catch(()=>0); if(used>0){ const ok=confirm(`Ordernummer ${orderNo} is al ${used}x gebruikt. Doorgaan?`); if(!ok) return false; } for(const skuUnique of batchSkus){ await doOutSingle(skuUnique, orderNo, locationOpt); } return true; }
async function doProcess(){ const loc=(locInput.value||'').trim(); const orderNo=(orderInput.value||'').trim(); try{ if(mode==='IN'){ if(!loc) return toast('Locatie is verplicht bij inslag.','err'); setStatus('Batch inboeken…'); await doBatchIn(loc); toast(`${batchSkus.length} colli ingeboekt op locatie ${loc}.`,'ok'); batchSkus=[]; renderBatch(); clearForm(false); } else { if(!orderNo) return toast('Ordernummer is verplicht bij uitslag.','err'); setStatus('Batch uitboeken…'); const completed=await doBatchOut(orderNo, loc); if(completed===false){ setStatus('Klaar'); return; } toast(`${batchSkus.length} colli uitgeboekt op order ${orderNo}.`,'ok'); batchSkus=[]; renderBatch(); clearForm(false); } }catch(e){ setStatus('Fout'); toast(e.message||String(e),'err'); } }
function addSkuToBatch(){ const sku=cleanSku(normalizeScan(skuInput.value)); if(!sku) return; if(!isValidUniqueSku(sku)){ toast('Stickerformaat ongeldig. Verwacht: SKU-BASE-00001','err'); skuInput.value=''; return; } if(batchSkus.includes(sku)){ toast(`SKU ${sku} is al gescand in deze batch.`,'err'); skuInput.value=''; return; } batchSkus.push(sku); renderBatch(); skuInput.value=''; skuInput.focus(); setStatus(`${batchSkus.length} colli gescand`); }
async function toggleQR(){ if(typeof Html5Qrcode!=='function') return toast('QR library ontbreekt.','err'); if(!qr) qr=new Html5Qrcode('qr_reader'); if(!qrRunning){ qrReader.classList.remove('hidden'); btnQr.textContent='Stop QR'; try{ const cams=await Html5Qrcode.getCameras(); if(!cams || !cams.length) throw new Error('Geen camera gevonden'); const preferred=cams.find(c=>/back|rear|environment/i.test(c.label)) || cams[0]; qrRunning=true; await qr.start(preferred.id,{fps:10,qrbox:{width:260,height:260}},(decodedText)=>{ skuInput.value=cleanSku(normalizeScan(decodedText)); stopQR().catch(()=>{}); addSkuToBatch(); if(mode==='OUT') orderInput.focus(); toast('QR gelezen.','ok'); }); setStatus('QR actief'); }catch(e){ qrRunning=false; qrReader.classList.add('hidden'); btnQr.textContent='Start QR'; setStatus('Fout'); toast('Camera start niet. Gebruik https en sta camera toe.','err'); } } else { await stopQR(); } }
async function stopQR(){ try{ if(qr && qrRunning) await qr.stop(); }catch(_){} qrRunning=false; qrReader.classList.add('hidden'); btnQr.textContent='Start QR'; setStatus('Klaar'); }
btnGo.addEventListener('click',doProcess); btnClear.addEventListener('click',()=>clearForm(true)); btnQr.addEventListener('click',()=>toggleQR()); btnUndoLast.addEventListener('click',()=>{ if(!batchSkus.length) return; batchSkus.pop(); renderBatch(); }); btnClearBatch.addEventListener('click',()=>{ batchSkus=[]; renderBatch(); }); tabIn.addEventListener('click',()=>setMode('IN')); tabOut.addEventListener('click',()=>setMode('OUT')); skuInput.addEventListener('input',()=>{ skuInput.value=normalizeScan(skuInput.value); }); skuInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addSkuToBatch(); if(mode==='OUT') orderInput.focus(); }}); locInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(mode==='IN') doProcess(); else orderInput.focus(); }}); orderInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doProcess(); }}); setMode('IN'); renderBatch(); clearForm(false);
</script>
</body></html>
